<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tile{min-width:42px;height:46px;padding:0 10px;background:var(--tile);border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700}

.grades{display:grid;gap:8px;margin-top:10px}.grades[hidden],.back[hidden]{display:none}

.bigspeak{font-size:20px;padding:16px 22px}.miss{padding:5px 0;border-bottom:1px solid var(--line)}

<body>
<div id="app"></div>
<script>
// Парсер vocab .md -> массив слов. Работает и в браузере, и в node.
(function (root) {
  const CYR = /[А-Яа-яЁё]/;
  const ART = /^(der|die|das)\s+/i;

  function clean(s) {
    return s.replace(/\*\*/g, '').replace(/`/g, '').replace(/\s+/g, ' ').trim();
  }

  function findSplit(line) {
    // 1) длинное/среднее тире
    let m = line.match(/\s[—–]\s/);
    if (m) {
      const i = m.index;
      return [line.slice(0, i), line.slice(i + m[0].length)];
    }
    // 2) дефис: берём первый ' - ', перед которым нет запятой и после которого есть кириллица
    const re = /\s-\s/g;
    let x;
    while ((x = re.exec(line))) {
      const before = line.slice(0, x.index);
      const after = line.slice(x.index + x[0].length);
      if (/,\s*$/.test(before)) continue;
      if (!CYR.test(after) || CYR.test(before)) continue;
      return [before, after];
    }
    // особый случай "der Würfel, - - кубик"
    const y = line.match(/^(.*,\s*-)\s-\s(.+)$/);
    if (y && CYR.test(y[2]) && !CYR.test(y[1])) return [y[1], y[2]];
    return null;
  }

  function parsePluralRule(rest) {
    const r = rest.trim();
    if (/^\(?\s*(Sg\.?|Singular)\s*\)?$/i.test(r)) return { plural: null, sg: true };
    if (/^\(?\s*Pl\.?\s*\)?$/i.test(r)) return { plural: null, pl: true };
    if (/^¨?-[a-z]{0,4}$/.test(r)) return { plural: r };
    return null;
  }

  function parseDe(deRaw) {
    let de = clean(deRaw).replace(/^r\s+(?=[A-ZÄÖÜ])/, 'der ').replace(/^e\s+(?=[A-ZÄÖÜ])/, 'die ').replace(/^s\s+(?=[A-ZÄÖÜ])/, 'das ');
    const out = { de, lemma: de, article: null, plural: null, sg: false, pos: 'other', forms: null, note: '' };

    // убрать скобки в конце: (Sg.) / (gerät, geriet, ist geraten) / (Petersilie)
    let paren = null;
    const pm = de.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (pm) { paren = pm[2]; de = pm[1]; }

    const am = de.match(ART);
    if (am) {
      out.article = am[1].toLowerCase();
      out.pos = 'noun';
      const parts = de.slice(am[0].length).split(/,\s*/);
      out.lemma = parts[0].trim();
      if (parts.length > 1) {
        const pr = parsePluralRule(parts.slice(1).join(', '));
        if (pr) { out.plural = pr.plural; out.sg = !!pr.sg; }
      }
      if (paren) {
        const pr = parsePluralRule('(' + paren + ')');
        if (pr) { out.sg = !!pr.sg; if (pr.plural) out.plural = pr.plural; }
        else out.note = paren;
      }
      return out;
    }

    // глагол с формами: "schneiden, schneidet, hat geschnitten" или "geraten (gerät, geriet, ist geraten)"
    let formsSrc = null;
    const parts = de.split(/,\s*/);
    if (parts.length >= 2 && /^(hat|ist)\s+\S+/.test(parts[parts.length - 1]) && !CYR.test(de)) {
      out.lemma = parts[0];
      formsSrc = parts.slice(1);
    } else if (paren && /,/.test(paren) && /(hat|ist)\s+\S+\s*$/.test(paren)) {
      out.lemma = de;
      formsSrc = paren.split(/,\s*/);
    } else {
      out.lemma = de;
      if (paren) out.note = paren;
    }
    if (formsSrc) {
      out.forms = formsSrc.map(s => s.trim());
      out.pos = 'verb';
    }
    return out;
  }

  function mkEntry(deRaw, ruRaw, ctx) {
    const de = clean(deRaw);
    const ru = clean(ruRaw).replace(/^["«»“”]+|["«»“”]+$/g, '');
    if (!de || !ru) return null;
    if (CYR.test(de)) return null;
    if (!CYR.test(ru)) return null;
    if (/[→⇒]/.test(de)) return null;
    if (de.length > 90) return null;
    const p = parseDe(de);
    if (/\s\/\s/.test(de)) { p.article = null; p.pos = 'other'; p.lemma = de; p.plural = null; p.sg = false; p.note = ''; }
    const words = p.lemma.split(/\s+/).filter(Boolean);
    const isSentence = !p.article && (/[.!?]$/.test(p.lemma) || (words.length >= 5 && !/\s\/\s/.test(p.lemma))) && !/(\.\.\.|…)/.test(p.lemma);
    const typable = p.lemma.length <= 26 && !/(\.\.\.|…|\+|\/|=|\(|\))/.test(p.lemma) && !isSentence;
    return Object.assign(p, {
      ru,
      topic: ctx.topic,
      file: ctx.file,
      phrase: isSentence,
      typable,
    });
  }

  function splitPairs(deRaw, ruRaw, ctx) {
    const semi = ruRaw.split(/;\s+/);
    if (semi.length > 1 && semi.slice(1).every(c => /\s[—–]\s/.test(c))) {
      const out = splitPairs(deRaw, semi[0], ctx);
      semi.slice(1).forEach(c => { const sp = findSplit(clean(c)); if (sp) out.push(...splitPairs(sp[0], sp[1], ctx)); });
      return out;
    }
    // "der Apfelsaft / der Orangensaft — яблочный/апельсиновый сок" -> две записи, если счёт совпадает
    const deParts = deRaw.split(/\s+\/\s+/);
    const ruParts = ruRaw.split(/\s*\/\s*/);
    if (deParts.length === 2 && ruParts.length === 2 && deParts.every(p => !CYR.test(p))
        && ruParts.every(p => p.trim().split(/\s+/).length === ruParts[0].trim().split(/\s+/).length)
        && deParts.every(p => ART.test(p.trim()) || p.split(/\s+/).length === 1)) {
      return deParts.map((d, i) => mkEntry(d, ruParts[i], ctx)).filter(Boolean);
    }
    const e = mkEntry(deRaw, ruRaw, ctx);
    return e ? [e] : [];
  }

  function parseMarkdown(text, fileName) {
    const entries = [];
    const lines = text.split(/\r?\n/);
    let topic = '';
    let fileTitle = fileName || '';
    const ctx = () => ({ topic: topic || 'Без темы', file: fileTitle });

    for (let raw of lines) {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) continue;

      if (/^#\s/.test(line)) { // заголовок файла
        const t = clean(line.replace(/^#\s*/, ''));
        const d = t.match(/(\d{4}-\d{2}-\d{2})/) || t.match(/(\d{2})\.(\d{2})\.(\d{4})/);
        if (d && !fileName) fileTitle = d.length === 2 ? d[1] : `${d[3]}-${d[2]}-${d[1]}`;
        continue;
      }
      if (/^#{2,4}\s/.test(line)) { topic = clean(line.replace(/^#+\s*/, '')); continue; }
      if (/^\*\*[^*]+\*\*\s*$/.test(line)) { topic = clean(line); continue; }
      if (/^\s/.test(line)) continue;           // вложенные примеры
      if (/^\|/.test(line)) continue;           // таблицы
      if (/^---+$/.test(line.trim())) continue;

      if (/^[-*]\s+/.test(line)) {
        let body = clean(line.replace(/^[-*]\s+/, ''));
        // антонимы: "schnell ↔ langsam (быстрый/медленный)"
        const ant = body.match(/^([^↔(]+?)\s*↔\s*([^(]+?)\s*\(([^)]+)\)\s*$/);
        if (ant && CYR.test(ant[3])) {
          const ruP = ant[3].split(/\s*\/\s*/);
          if (ruP.length === 2) {
            [ [ant[1], ruP[0]], [ant[2], ruP[1]] ].forEach(([d, r]) => {
              const e = mkEntry(d, r, ctx()); if (e) entries.push(e);
            });
          }
          continue;
        }
        const sp = findSplit(body);
        if (!sp) continue;
        splitPairs(sp[0], sp[1], ctx()).forEach(e => entries.push(e));
        continue;
      }

      // строки вида "Глаголы: a — b; c — d; ..."
      const lm = line.match(/^([А-Яа-яЁё][^:]{0,40}):\s+(.+)$/);
      if (lm && /\s[—–]\s/.test(lm[2])) {
        lm[2].split(/;\s*/).forEach(chunk => {
          const sp = findSplit(clean(chunk).replace(/\.$/, ''));
          if (sp) { const e = mkEntry(sp[0], sp[1], ctx()); if (e) entries.push(e); }
        });
      }
    }
    return { file: fileTitle, entries };
  }

  // нормализация для сравнения ответов: ä=ae=a:, ö=oe=o:, ü=ue=u:, ß=ss
  function normAnswer(s) {
    return String(s).toLowerCase()
      .replace(/[·\-\s.,!?;"'«»()]/g, '')
      .replace(/ä|a:/g, 'ae').replace(/ö|o:/g, 'oe').replace(/ü|u:/g, 'ue')
      .replace(/ß/g, 'ss');
  }

  const api = { parseMarkdown, normAnswer, parseDe };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.VocabParser = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

const EMBEDDED = [{"name": "2026-06-11", "text": "# Vocab — 2026-06-11 (Lagune KB 40-43, Arbeitsbuch 39-48, Paremskaja 46-48)\n\n**Завтрак (Lagune KB 40-43, AB 44-45)**\n- der Honig — мёд\n- die Marmelade — варенье\n- der Quark — творог\n- die Wurst — колбаса\n- der Käse — сыр\n- das Müsli — мюсли\n- das Brötchen — булочка\n- der Apfelsaft / der Orangensaft — яблочный/апельсиновый сок\n- der Schinken — ветчина\n- die Nuss-Nougat-Creme — ореховый крем\n- das Frühstücksei — яйцо на завтрак\n- das Schwarzbrot — чёрный хлеб\n- der Joghurt — йогурт\n- die Scheibe — ломтик\n- der Becher — стаканчик/кружка\n\n**Прилагательные-антонимы (AB S.39)**\n- schnell ↔ langsam (быстрый/медленный)\n- groß ↔ klein (большой/маленький)\n- hoch ↔ tief (высокий/низкий)\n- neu ↔ alt (новый/старый)\n- voll ↔ leer (полный/пустой)\n- süß ↔ sauer (сладкий/кислый)\n- trocken ↔ nass (сухой/мокрый)\n- richtig ↔ falsch (правильный/неправильный)\n- ruhig ↔ nervös (спокойный/нервный)\n- traurig ↔ spannend (грустный/захватывающий)\n- jung ↔ alt\n- kurz ↔ lang\n\n**Lernwortschatz Einheit 7 (AB S.42) — ресторан/театр**\n- die Bedienung — обслуживание\n- die Garderobe — гардероб\n- die Speisekarte — меню\n- die Quittung — чек\n- die Decke — скатерть/потолок\n- die Stimme — голос\n- die Probe — репетиция\n- das Theaterstück — пьеса\n- der Imbiss — закусочная\n- das Gasthaus — трактир\n- der Biergarten — пивной сад\n- die Tasse — чашка\n- der Schluck — глоток\n- die Tischdecke — скатерть\n- der Tischnachbar — сосед по столу\n- die Mehrwertsteuer — НДС\n- das Kännchen — кофейничек\n- die Portion — порция\n\nГлаголы: beobachten — наблюдать; dauern — длиться; denken, dachte, hat gedacht — думать; klappen — получаться; reden — говорить; schlagen, schlug, hat geschlagen — бить; versprechen, verspricht, hat versprochen — обещать; vertragen, verträgt, hat vertragen — переносить; weiter-gehen, geht weiter, ist weitergegangen — продолжаться.\n\nПрочее: am besten/meisten — лучше/больше всего; besonders — особенно; billig — дешёвый; heiß — горячий; immer noch nicht/nichts — до сих пор не/ничего; meistens — чаще всего; sowieso — всё равно; unterwegs — в пути; vorsichtig — осторожно.\n\n**Komparativ/Superlativ и Imperativ (AB S.47)**\n- klein–kleiner–am kleinsten\n- süß–süßer–am süßesten\n- schön–schöner–am schönsten\n- gern–lieber–am liebsten\n- gut–besser–am besten\n- viel–mehr–am meisten\n\nImperativ \"wir\": Gehen wir! Warten wir! Nehmen wir...! Lesen wir...! Fangen wir an! Seien wir...!\n\n**Lernwortschatz Einheit 8 (AB S.48)**\n- der Appetit — аппетит\n- das Bargeld — наличные\n- das Dessert — десерт\n- die Erdbeere — клубника\n- der/die Erwachsene — взрослый\n- der Gastgeber — хозяин\n- die Kirsche — вишня\n- das Knäckebrot — хрустящий хлебец\n- der Lammbraten — жаркое из баранины\n- das Omelett — омлет\n- das Prozent — процент\n- das Rezept — рецепт\n- die Salami — салями\n- die Suppe — суп\n- der Teller — тарелка\n- die Vorspeise — закуска\n- der Weinberg — виноградник\n- der Zwieback — сухарь\n\nГлаголы: an-bieten — предлагать; aus-probieren — пробовать; dabei haben — иметь при себе; erleben — переживать; reservieren — бронировать; wieder-kommen — возвращаться.\n\n**Possessivpronomen (Paremskaja S.46-48)**\n- mein — мой; dein — твой; sein — его; ihr — её/их; unser — наш; euer — ваш; Ihr — Ваш (вежл.)\n- склонение притяжательных местоимений по падежам\n"}, {"name": "2026-06-14", "text": "# Vocab - 2026-06-14\n\n**Küche & Zutaten (Lagune KB 49-51, AB Lernwortschatz S.60)**\n- die Küche - кухня\n- der Topf, ¨-e - кастрюля\n- die Pfanne, -n - сковорода\n- das Geschirr - посуда\n- das Handtuch, ¨-er - полотенце\n- die Spülmaschine, -n - посудомоечная машина\n- die Kanne, -n - чайник / кофейник\n- die Kartoffelscheibe, -n - ломтик картофеля\n- der Würfel, - - кубик\n- der Zwiebelwürfel, - - кубик лука\n- die Zutat, -en - ингредиент\n- die Petersilie - петрушка\n- der Bund (Petersilie) - пучок (петрушки)\n- die Orange, -n - апельсин\n- der Boden, ¨- - дно\n- das Ganze - всё, n- das Trinkgeld - чаевые\n- der Ober, = - официант\n\n**Andere Wörter**\n- getrennt - отдельно, раздельно (напр. платить по отдельности)\n- günstig - выгодный, дешёвый\n- höflich / unhöflich - вежливый / невежливый\n- plötzlich - вдруг, внезапно\n- traurig - грустный\n- oben - сверху, наверху\n- ungewöhnlich - необычный\n- die Variation, -en - вариация\n\n**Wortbildung: zusammengesetzte Nomen (AB S.53)**\n- der Geldautomat = das Geld + der Automat - банкомат\n- die Telefonnummer = das Telefon + die Nummer - номер телефона\n- das Abendkleid = der Abend + das Kleid - вечернее платье\n- der Taxifahrer = das Taxi + der Fahrer - таксист\n- die Zwiebelsuppe = die Zwiebel + die Suppe - луковый суп\n\n**Mengenangaben in der Umgangssprache (AB S.53)**\n- einen Kaffee (bestellen) - заказать чашку кофе\n- ein Eis - порцию мороженого\n- einen Wein - бокал вина\n- ein Bier - бокал/кружку пива\n- ein Stück Kuchen - кусок пирога\n"}, {"name": "2026-06-18", "text": "# Vocab - 2026-06-18\n\n**Technik & Alltag (Lagune KB 58-59)**\n- das Handy, -s - мобильный телефон\n- der Computer, - - компьютер\n- die Schülerumfrage, -n - опрос школьников\n- das Interview, -s - интервью\n- die SMS, - - смс-сообщение\n- schicken - посылать, отправлять\n- benutzen - пользоваться, использовать\n- verwenden - использовать, применять\n- herunterladen - скачивать\n- hochladen - загружать (в интернет)\n- chatten - общаться в чате\n- berichten - сообщать, рассказывать\n- recherchieren - искать информацию, изучать\n- der Taschenrechner, - - калькулятор\n\n**Körperpflege & Morgenroutine (AB 63-67)**\n- an·kleiden (sich) - одеваться\n- bürsten - расчёсывать/чистить щёткой\n- föhnen - сушить феном\n- das Gesicht waschen - умываться\n- kämmen - расчёсывать\n- rasieren (sich) - бриться\n- der Rasierapparat, -e - электробритва\n- der Föhn, -e - фен\n- die Bürste, -n - щётка\n- der Kamm, ¨-e - расчёска\n- trocken - сухой\n- nass - мокрый, влажный\n- glatt - гладкий, ровный\n- bügeln - гладить (одежду)\n- die Jacke, -n - куртка, жакет\n- der Regenschirm, -e - зонт\n- die Gummistiefel (Pl.) - резиновые сапоги\n- die Fußnägel (Pl.) - ногти на ногах\n\n**Partizip I als Attribut (грамматика, AB 63)**\n- schreibend - пишущий (Partizip I от schreiben)\n- lachend - смеющийся\n- singend - поющий\n- Partizip I = Infinitiv + d → как прилагательное: das lachende Kind\n\n**um ... zu / damit (грамматика, AB 65-68)**\n- um ... zu + Infinitiv - чтобы ... (одно подлежащее: Er lernt, um Deutsch zu sprechen.)\n- damit + Satz - чтобы ... (разные подлежащие: Er lernt, damit seine Kinder Deutsch sprechen.)\n- Er wäscht die Jacke, damit sie sauber wird. - Он стирает куртку, чтобы она стала чистой.\n- Sie öffnet den Regenschirm, damit ihre Haare nicht nass werden. - Она открывает зонт, чтобы волосы не намокли.\n- Er bügelt ihr Kleid, damit es schön glatt wird. - Он гладит её платье, чтобы оно стало ровным.\n\n**Lernwortschatz (AB Grammatik/Lernwortschatz S.68)**\n- auf·schreiben, schreibt auf, hat aufgeschrieben - записывать\n- gleichzeitig - одновременно\n- pflegen - ухаживать (за кем-то/чем-то)\n- außerdem - кроме того, вдобавок\n- die Fitness - физическая форма, фитнес\n- die Massage, -n - массаж\n- der Film, -e - фильм\n- abhängig (von) - зависящий (от)\n- der Vorteil, -e - преимущество\n- der Nachteil, -e - недостаток\n- der Jugendliche, -n - подросток, молодой человек\n\n**Weitere Verben aus den Übungen**\n- an·fangen, fängt an, hat angefangen - начинать\n- duschen - принимать душ\n- auf·hören - заканчивать, прекращать\n- aus·bilden - обучать, готовить специалиста\n- versuchen - пытаться, стараться\n- gelingen (es gelingt dir) - удаваться\n- schaffen - справляться, успевать\n"}, {"name": "2026-06-22", "text": "# Vocab – 2026-06-22\n## Курсбух с. 60–63 + Арбайтсбух с. 69–72\n\n---\n\n### Транспорт и город (KB S. 60–61)\n\n- die Ampel, -n – светофор\n- die Straße, -n – улица\n- der Radfahrer, – – велосипедист\n- der Radweg, -e – велодорожка\n- der Fußgänger, – – пешеход\n- der Bus, -se – автобус\n- das Taxi, -s – такси\n- der Taxifahrer / die Taxifahrerin – таксист / таксистка\n- die Höflichkeit – вежливость\n- höflich – вежливый\n- die Haltestelle, -n – остановка\n\n---\n\n### Дом и техника (AB S. 69 / Lernwortschatz S. 73)\n\n- das Gerät, -e – прибор, устройство\n- der Geschirrspüler, – – посудомоечная машина\n- die Waschmaschine, -n – стиральная машина\n- der Wäschetrockner, – – сушилка для белья\n- die Wäsche – бельё (для стирки)\n- das Waschbecken, – – раковина\n- die Kaffeemaschine, -n – кофеварка\n- der Kühlschrank, -̈e – холодильник\n- der Herd, -e – плита\n- der Mixer, – – миксер\n- das Bügeleisen, – – утюг\n- der Föhn, -e – фен\n- der Rasierapparat, -e – электробритва\n- die Stereoanlage, -n – стереосистема\n- der Fernseher, – – телевизор\n- das Fernsehgerät, -e – телевизор (тех.)\n- die Bohrmaschine, -n – дрель\n- das Handy, -s – мобильный телефон\n- der Fotoapparat, -e – фотоаппарат\n- der DVD-Rekorder, – – DVD-рекордер\n- der MP3-Player, – – МП3-плеер\n- die Batterie, -n – батарея\n- die Glühbirne, -n – лампочка\n- die Heizung, -en – отопление, радиатор\n- der Stromanschluss, -̈e – розетка / подключение к электросети\n- die Dusche, -n – душ\n- die Badewanne, -n – ванна\n- der Flur, -e – коридор, прихожая\n- der Briefkasten, -̈ – почтовый ящик\n- der Vorhang, -̈e – штора, занавеска\n- der Kinderwagen, – – детская коляска\n\n---\n\n### Квартира и окружение (Lernwortschatz S. 73)\n\n- der Ausblick, -e – вид, обзор\n- der Schatten, – – тень\n- der Schritt, -e – шаг\n- der Türspalt, -e – щель в двери\n- das Versteck, -e – укрытие, тайник\n- der Taschendieb, -e – карманный вор\n- der Wagen, – – машина, вагон\n- der Lastwagen, – – грузовик\n- die Pflanze, -n – растение\n- das Namensschild, -er – именная табличка / вывеска\n- das Chaos – хаос\n- das Mal, -e – раз (das erste Mal – первый раз)\n\n---\n\n### История «Mia» (KB S. 62–63)\n\n- sich verstecken – прятаться\n- entkommen (entkommt) – сбежать, вырваться\n- finden – находить\n- der Karton, -s – картонная коробка\n- das Aquarium, Aquarien – аквариум\n- bemerken – замечать\n- gefangen nehmen – брать в плен\n- befreien – освобождать\n- langsam – медленно\n- aufheben – поднимать\n\n---\n\n### Прилагательные и оценки (AB S. 71–72)\n\n- schön – красивый, прекрасный\n- herrlich – великолепный\n- wundervoll – восхитительный\n- toll – классный\n- angenehm – приятный\n- einfach – простой / просто\n- interessant – интересный\n- spannend – захватывающий, напряжённый\n- langweilig – скучный\n- anstrengend – утомительный, напряжённый\n- kompliziert – сложный\n- schwierig – трудный\n- gefährlich – опасный\n- unheimlich – жуткий, пугающий\n\n---\n\n### Глаголы и фразы (AB S. 71–72)\n\n- früh aufstehen – рано вставать\n- früh aufhören – рано заканчивать\n- spät zurückfahren – поздно возвращаться\n- zusammen wegfahren – уехать вместе\n- einen Koffer abstellen – поставить чемодан\n- Geschenke aussuchen – выбирать подарки\n- im Supermarkt einkaufen – делать покупки в супермаркете\n- einem Tiger entkommen – сбежать от тигра\n- alles von jmdm. erfahren – узнать всё от кого-то\n- Freunden zuhören – слушать друзей\n- zuhören (+ Dat.) – слушать кого-либо\n- verstehen – понимать\n- versuchen – пытаться, пробовать\n- am Urlaubsort ankommen – прибыть на место отдыха\n\n---\n\n### Грамматика: союз «dass» (AB S. 73, §23)\n\n- dass (подчинительный союз) – что\n  - Sie hört, **dass** jemand im Flur ist. – Она слышит, что кто-то в коридоре.\n- weil – потому что (глагол в конце)\n- denn – ведь, потому что (глагол на 2-м месте)\n- deshalb – поэтому\n- damit – чтобы (цель)\n- ob – ли (косвенный вопрос)\n\n### Грамматика: Indefinitpronomen (AB S. 73)\n\n- alles – всё\n- nichts – ничего\n- jemand – кто-то\n- niemand – никто\n- etwas – что-то\n- alle – все\n- jede/r/s – каждый\n- jeder – каждый\n"}, {"name": "2026-06-25", "text": "# Vocab – 2026-06-25\n## KB с. 64–67 + AB с. 75–79 | Lektion 13 – Wohnung & Möbel\n\n---\n\n### Мебель и предметы интерьера\n\n- das Möbelhaus, -̈er – мебельный магазин\n- das Möbelstück, -e – предмет мебели\n- der Schrank, -̈e – шкаф\n- der Kleiderschrank, -̈e – платяной шкаф\n- das Bücherregal, -e – книжный стеллаж\n- das Regal, -e – полка / стеллаж\n- der Sessel, – – кресло\n- das Schlafsofa, -s – диван-кровать\n- das Doppelbett, -en – двуспальная кровать\n- das Kinderbett, -en – детская кровать\n- der Couchtisch, -e – журнальный столик\n- der Esstisch, -e – обеденный стол\n- der Holztisch, -e – деревянный стол\n- der Computertisch, -e – компьютерный стол\n- der Fernsehsessel, – – телевизионное кресло\n- die Lampe, -n – лампа\n- der Teppich, -e – ковёр\n- die Tapete, -n – обои\n\n---\n\n### Комнаты (Zusammengesetzte Nomen: Verb/Nomen + Zimmer)\n\n- das Wohnzimmer – гостиная (wohnen + Zimmer)\n- das Schlafzimmer – спальня (schlafen + Zimmer)\n- das Esszimmer – столовая (essen + Zimmer)\n- das Arbeitszimmer – рабочий кабинет (Arbeit + Zimmer)\n- das Kinderzimmer – детская (Kind + Zimmer)\n- der Schreibtisch – письменный стол (schreiben + Tisch)\n- der Küchentisch – кухонный стол (Küche + Tisch)\n\n---\n\n### Строительство / ремонт / переезд\n\n- der Baumarkt, -̈e – строительный магазин (типа OBI)\n- das Maßband, -̈er – рулетка\n- der Hammer, -̈ – молоток\n- der Nagel, -̈ – гвоздь\n- das Loch, -̈er – дыра, отверстие\n- die Höhe – высота\n- die Stromleitung, -en – электропроводка\n- der Vermieter, – – арендодатель / хозяин квартиры\n- der Mieter, – – арендатор / съёмщик\n- das Spülbecken, – – кухонная раковина\n- klingeln – звонить (в дверной звонок)\n- messen (misst), hat gemessen – измерять\n- ausmessen – измерять (размеры помещения)\n- bohren – сверлить\n- ein Loch bohren – просверлить дыру\n- renovieren – делать ремонт (в квартире)\n- einrichten – обустраивать, меблировать\n- abreißen (reißt ab), hat abgerissen – срывать, сносить\n- umziehen (zieht um), ist umgezogen – переезжать\n- aufhängen – вешать (на стену)\n- vorhaben – планировать, собираться\n\n---\n\n### Прилагательные\n\n- breit – широкий\n- niedrig – низкий\n- schwach – слабый, маломощный\n- stark – сильный, мощный\n- gefährlich – опасный\n- praktisch – практичный / практично\n- unpraktisch – непрактичный\n- perfekt – отлично, идеально\n- persönlich – лично, персонально\n- dabei sein – быть при этом, присутствовать\n\n---\n\n### Грамматика: Komparativ mit Umlaut (AB с. 78, §9b)\n\n| Positiv | Komparativ | Superlativ |\n|---------|------------|------------|\n| scharf | schärfer | am schärfsten |\n| stark | stärker | am stärksten |\n| lang | länger | am längsten |\n| groß | größer | am größten |\n| hoch | höher | am höchsten |\n| kurz | kürzer | am kürzesten |\n\n---\n\n### Грамматика: Verlaufsform (AB с. 78, §11)\n\nВыражает действие «прямо сейчас»:\n- Er bohrt **gerade** ein Loch. – Он **сейчас** сверлит дыру.\n- Es **ist dabei**, ein Loch **zu bohren**. – Он **в процессе** сверления.\n\n---\n\n### Wörter im Kontext (из Lernwortschatz)\n\n- Der Tisch steht **in der Ecke**. – Стол стоит в углу.\n- Tante Marga kommt **aus dem Kaffee**. – ...из кафе.\n- Die Glühbirne hat 40 Watt.\n- Es schlägt **einen Nagel in die Wand**. – Вбивает гвоздь в стену.\n- Sie ist **auch nicht** viel größer.\n- Die Glühbirne ist **schwächer** als 40 Watt / **stärker** als 40 Watt.\n"}, {"name": "2026-07-02", "text": "# Vocab - 2026-07-02\n\n**Wohnung & Wohnungsanzeigen (Lagune KB 70-71, AB 80-83)**\n- die Wohnung, -en - квартира\n- die Wohnungsanzeige, -n - объявление о жилье\n- die Miete, -n - аренда, квартплата\n- die Nebenkosten (Pl.) - коммунальные расходы (дополнительно к аренде)\n- der Makler, - - риелтор\n- der Vermieter, - - домовладелец, арендодатель\n- das Mietpreis, -e / der Mietpreis - арендная плата\n- die Monatsmiete, -n - ежемесячная арендная плата\n- die Zentralheizung, -en - центральное отопление\n- die Heizung, -en - отопление\n- die Küchenzeile, -n - кухонный блок\n- die Terrasse, -n - терраса\n- der Stadtrand, ¨-er - окраина города\n- inkl. (inklusive) - включая, в том числе\n- mitten (in) - в самом центре (чего-л.)\n- renovieren - ремонтировать, обновлять\n- renoviert - отремонтированный\n- bequem - удобный, комфортный\n- Strom, Gas und so weiter - электричество, газ и так далее\n- Alles ist voll Schnee. - Всюду полно снега. (Wörter im Kontext)\n- Bescheid sagen - сообщить, предупредить\n- recht haben - быть правым\n\n**Adjektive zur Wohnung (AB 82, Lernwortschatz)**\n- abwechselnd - поочерёдно, по очереди\n- dünn - тонкий, худой\n- eng - тесный, узкий\n- feucht - влажный\n- modern - современный\n- nass - мокрый\n- so ... wie - так же ... как\n- trocken - сухой\n- ungesund - нездоровый\n- wach - бодрствующий, бодрый\n- wahrscheinlich - вероятно, скорее всего\n\n**Nomen (AB 82, Lernwortschatz)**\n- der Aufzug, ¨-e - лифт\n- der Bach, ¨-e - ручей\n- die Bahn, -en - железная дорога / линия метро\n- das Boot, -e - лодка\n- das Dach, ¨-er - крыша\n- der Elektriker, - - электрик\n- die Erfahrung, -en - опыт\n- die Garage, -n - гараж\n- das Gas - газ\n- der Handwerker, - - мастер, рабочий\n- die Katze, -n - кошка\n- die Kaution, -en - залог (при аренде)\n- der Kellner, - - официант\n- das Land - деревня, сельская местность / страна\n- der Makler, - - риелтор\n- der Mietpreis, -e - арендная плата\n- die Monatsmiete, -n - ежемесячная аренда\n- der Motor, -en - двигатель\n- die Nähe - близость; in der Nähe - рядом, поблизости\n- das Netz, -e - сеть\n- der Ofen, ¨- - печь, духовка\n- das Ohr, -en - ухо\n- der Park, -s - парк\n- der Pilot, -en - пилот\n- die Qualität, -en - качество\n- der Reim, -e - рифма\n- der Reisepass, ¨-e - загранпаспорт\n- das Schaf, -e - овца\n- die Socke, -n - носок\n- der Stadtrand, ¨-er - окраина города\n- die Terrasse, -n - терраса\n- die U-Bahn, -en - метро\n- der Vers, -e - стих, строфа\n- der Wolf, ¨-e - волк\n- die Wohnungsanzeige, -n - объявление о квартире\n- der Wolf - волк\n- die Zentralheizung, -en - центральное отопление\n\n**Verben (AB 82, Lernwortschatz)**\n- begrüßen - приветствовать\n- Bescheid sagen - сообщить, уведомить\n- beizen - морить (дерево) / травить\n- informieren - информировать\n- recht haben - быть правым\n- reimen - рифмовать\n\n**Vergleich: Komparativ & Positiv (грамматика, AB 82)**\n- so groß wie ... - такой же большой, как ...\n- so lang wie ... - такой же длинный, как ...\n- nicht so groß wie ... - не такой большой, как ...\n- größer als ... - больше, чем ...\n- länger als ... - длиннее, чем ...\n- Der Baum ist so hoch wie das Haus. - Дерево такое же высокое, как дом.\n- Der Vater ist größer als der Sohn. - Отец выше, чем сын.\n\n**Phonetik: Vokale lang/kurz (Lagune KB 68, Lerneinheit 14)**\n- Vokal lang → meist: offene Silbe, Doppelvokal (aa, ee, oo), Vokal + h\n- Vokal kurz → meist: Vokal + Doppelkonsonant (mm, tt, ck...)\n- Beispiele kurz: Puppe, Sonne, Tasse, Wasser, Kasse, Klasse\n- Beispiele lang: Papier, Klavier, Tiger, Probleme, Eule, Strauße\n"}, {"name": "2026-07-09", "text": "# Vocab - 2026-07-09\n\n**Kleidung & Mode (AB Lerneinheit 17)**\n- der Rock, ¨-e - юбка\n- der Anzug, ¨-e - костюм (мужской)\n- der Pullover / der Pulli - свитер, пуловер\n- die Bluse, -n - блузка\n- das Kleid, -er - платье\n- das Sonntagskleid - воскресное платье\n- der Hut, ¨-e - шляпа\n- die Stiefel (Pl.) - сапоги\n- der Sportschuh, -e - кроссовок, спортивная обувь\n- der Schmuck - украшения\n- das Piercing, -s - пирсинг\n- der Ring, -e - кольцо\n- die Frisur, -en - причёска\n- der Fleck, -e - пятно\n- die Reinigung, -en - химчистка\n- der Zopf, ¨-e - коса (причёска)\n\n**Modalverben: Präteritum (AB 95-96)**\n- sollte - должен был (Prät. von sollen)\n- wollte - хотел (Prät. von wollen)\n- konnte - мог (Prät. von können)\n- durfte - имел право (Prät. von dürfen)\n- musste - должен был (Prät. von müssen)\n- Er wollte heute pünktlich sein. - Он хотел прийти вовремя.\n- Sie konnte heute nicht zur Party gehen. - Она не смогла пойти на вечеринку.\n\n**Adjektive: unregelmäßige Formen (AB 96, Grammatik S.100)**\n- dunkel → dunkler / dunkle / dunkles / dunklen - тёмный\n- teuer → teurer / teure / teures / teuren - дорогой\n- hoch → hoher / hohe / hohes / hohen - высокий\n- Der Turm ist hoch. / Ein hoher Turm. - Башня высокая. / Высокая башня.\n\n**Meinungen & Geschmack (AB 97-99)**\n- die Meinung, -en - мнение\n- die Mode, -n - мода\n- der Geschmack - вкус\n- der Kompromiss, -e - компромисс\n- der Konflikt, -e - конфликт\n- stehen (jemandem steht etw.) - идти (кому-то что-то идёт)\n- Der rote Rock steht ihr gut. - Красная юбка ей идёт.\n- urteilen (über) - судить (о чём-то), давать оценку\n- ehrlich - честный\n- beleidigt - обиженный, обидевшийся\n- schick - шикарный, стильный\n- entzückend - восхитительный\n- frech - дерзкий, нахальный\n- schlimm - плохой, серьёзный\n- obwohl - хотя\n- damals - тогда, в то время\n- neulich - недавно\n- bisher - до сих пор\n- genauso - точно так же\n- vorher - раньше, прежде\n\n**Lernwortschatz AB 17 (Nomen)**\n- der Alptraum, ¨-e - кошмар\n- die Bibliothek, -en - библиотека\n- die Diskussion, -en - дискуссия\n- die Freundschaft, -en - дружба\n- das Gefühl, -e - чувство\n- der Gedanke, -n - мысль\n- die Kunst, ¨-e - искусство\n- die Nichte, -n - племянница\n- die Oper, -n - опера\n- das Recht, -e - право\n- die Prüfung, -en - экзамен\n- das Thema, Themen - тема\n- der Wutanfall, ¨-e - вспышка гнева\n- das Verständnis - понимание\n- das Universum - вселенная\n\n**Lernwortschatz AB 17 (Verben)**\n- ab·schneiden, schneidet ab, hat abgeschnitten - отрезать\n- behalten, behält, hat behalten - сохранять, удерживать\n- hassen - ненавидеть\n- klettern, ist geklettert - карабкаться\n- protestieren - протестовать\n- streiten, streitet, hat gestritten - ссориться, спорить\n- verhindern - предотвращать, мешать\n- zurück·geben, gibt zurück, hat zurückgegeben - возвращать\n- lösen - решать, развязывать\n\n**Adjektive: Endungen (KB 81-83, Fokus Strukturen Lektion 16)**\n- Adjektiv nach definitem Artikel: der alte Mann / die kleine Frau / das runde Auto\n- Adjektiv nach indefinitem Artikel: ein alter Mann / eine kleine Frau / ein rundes Auto\n- dick - толстый\n- dünn - тонкий\n- lustig - весёлый, смешной\n- traurig - грустный\n- rund - круглый\n- geöffnet - открытый\n- geschlossen - закрытый\n- leer - пустой\n- voll - полный\n- bunt - разноцветный\n\n**Satzstruktur (Grammatik A1 S.24)**\n- das Subjekt - подлежащее\n- das Verb, -en - глагол\n- die Ergänzung, -en - дополнение (в грамматике)\n- die Nominativ-Ergänzung - дополнение в именительном падеже\n- die Akkusativ-Ergänzung - дополнение в винительном падеже\n- die Dativ-Ergänzung - дополнение в дательном падеже\n- temporal - временно́е (указывает на время)\n- lokal - местное (указывает на место)\n- modal - модальное (указывает на способ действия)\n- buchstabieren - произносить/писать по буквам\n\n**Konjugation Präsens: regelmäßige Verben (Grammatik A1 S.25-27)**\n- die Konjugation - спряжение\n- regelmäßig - правильный (о глаголах)\n- unregelmäßig - неправильный\n- der Verbstamm - основа глагола\n- die Personalendung, -en - личное окончание\n- gratulieren - поздравлять\n- wiederholen - повторять\n- reparieren - ремонтировать\n- empfehlen, empfiehlt - рекомендовать\n- probieren - пробовать\n- schmecken - быть вкусным; нравиться на вкус\n- benutzen - использовать\n- erklären - объяснять\n- glauben - думать, считать; верить\n- schließen - закрывать\n- verstehen - понимать\n- suchen - искать\n\n**Orte & Alltag (Grammatik A1 S.26-27)**\n- das Kaufhaus, ¨-er - универмаг\n- die Kasse, -n - касса\n- das Regal, -e - полка, стеллаж\n- das Internetcafé, -s - интернет-кафе\n- der Drucker, - - принтер\n- die Mütze, -n - шапка, шапочка\n- wandern - ходить в поход, гулять\n- stellen (auf den Tisch) - ставить (на стол)\n- kaputt - сломанный\n"}, {"name": "2026-07-13", "text": "# Vocab - 2026-07-13\n\n**Modalverben: Präteritum (KB S.84)**\n- wollen → wollte - хотеть (прош. вр.)\n- können → konnte - мочь, уметь (прош. вр.)\n- sollen → sollte - должен (по указанию другого) (прош. вр.)\n- dürfen → durfte - иметь право, разрешено (прош. вр.)\n- müssen → musste - быть вынужденным (прош. вр.)\n- Ich konnte nicht kommen. - Я не мог(ла) прийти.\n- Sie musste zum Flughafen fahren. - Ей пришлось ехать в аэропорт.\n- Er sollte eine Kundin abholen. - Он должен был забрать клиентку.\n- Ich durfte auf keinen Fall zu spät kommen. - Я ни в коем случае не имела права опоздать.\n\n**Orte & Situationen (KB S.84)**\n- die Reinigung, -en - химчистка\n- die Kundin, -nen - клиентка\n- der Flughafen, ¨- - аэропорт\n- ab|holen - забирать, встречать\n- landen, ist gelandet - приземляться\n- auf keinen Fall - ни в коем случае\n- schließlich - в конце концов, наконец\n- pünktlich - вовремя, пунктуально\n- das Viertel vor acht - без четверти восемь (07:45)\n- das Vorstellungsgespräch, -e - собеседование (о работе)\n\n**Kleidung & Farben (KB S.85)**\n- der Anzug, ¨-e - костюм (мужской)\n- die Krawatte, -n - галстук\n- der Pullover, - - свитер\n- die Hose, -n - брюки\n- der Stiefel, - - сапог\n- der Gummistiefel, - - резиновый сапог\n- die Strümpfe (Pl.) - чулки, носки\n- die Handschuhe (Pl.) - перчатки\n- bequem - удобный\n- eng - узкий, облегающий\n- weit - широкий, свободный\n- flach - плоский, на плоской подошве (о туфлях)\n- unmodern - немодный\n- die Lieblingsfarbe, -n - любимый цвет\n- das Bewerbungsgespräch, -e - собеседование (о работе)\n- die Hochzeit, -en - свадьба\n- die Disco, -s - дискотека\n\n**Adjektivdeklination: def. und indef. Artikel (KB S.85)**\n- der rote Rock → Ich mag **den** roten Rock. / Ich brauche **einen** roten Rock.\n- die blaue Bluse → Ich mag **die** blaue Bluse. / Ich brauche **eine** blaue Bluse.\n- das helle Hemd → Ich mag **das** helle Hemd. / Ich brauche **ein** helles Hemd.\n- die schwarzen Schuhe → Ich mag **die** schwarzen Schuhe. / Ich brauche **schwarze** Schuhe.\n- dunkel → die **dunklen** Schuhe\n- hoch → die **hohen** Schuhe\n\n**Unregelmäßige Verben im Präsens — Vokalwechsel (GA1 S.29-31)**\n- fahren — fährt (ä) - ехать\n- essen — isst (i) - есть\n- geben — gibt (i) - давать\n- helfen — hilft (i) - помогать\n- lesen — liest (ie) - читать\n- nehmen — nimmt (i) - брать\n- schlafen — schläft (ä) - спать\n- sehen — sieht (ie) - видеть\n- sprechen — spricht (i) - говорить\n- tragen — trägt (ä) - носить (одежду), нести\n- waschen — wäscht (ä) - мыть, стирать\n- vergessen — vergisst (i) - забывать\n- halten — hält (ä) - останавливаться; держать\n- empfehlen — empfiehlt (ie) - рекомендовать\n- treffen — trifft (i) - встречать; попадать\n- beginnen — beginnt (kein Wechsel) - начинать\n- der Umzug, ¨-e - переезд; парад\n- der Schrank, ¨-e - шкаф\n- die Waschmaschine, -n - стиральная машина\n- der Vermieter, - - арендодатель, хозяин квартиры\n- der Nachbar, -n - сосед\n- die Miete, -n - арендная плата\n- die Nebenkosten (Pl.) - коммунальные платежи\n\n**sein und haben im Präsens (GA1 S.32-33)**\n- sein: ich bin / du bist / er ist / wir sind / ihr seid / sie sind\n- haben: ich habe / du hast / er hat / wir haben / ihr habt / sie haben\n- sein als Vollverb: Sie ist Ärztin. / Sie ist gesund.\n- sein als Hilfsverb: Sie ist in die Schule gegangen.\n- haben als Vollverb: Sie hat einen Hund. / Sie hat Fieber.\n- haben als Hilfsverb: Sie hat einen Test geschrieben.\n- der Termin, -e - запись (к врачу), встреча, срок\n- das Rezept, -e - рецепт (мед.)\n- die Kopfschmerzen (Pl.) - головная боль\n- der Zahnarzt, ¨-e - зубной врач\n- der Hunger - голод\n- der Durst - жажда\n- der Hals, ¨-e - горло; шея\n- schwanger - беременная\n- der Husten - кашель\n- der Schnupfen - насморк\n- die Grippe - грипп\n- der Balkon, -s/-e - балкон\n- die Nebenkosten - коммунальные расходы\n- einziehen, ist eingezogen - въезжать (в квартиру)\n\n**Trennbare Verben (GA1 S.34-36)**\n- an|rufen - звонить по телефону\n- ab|fahren - отъезжать\n- aus|sehen - выглядеть\n- um|steigen - пересаживаться\n- ein|kaufen - делать покупки\n- auf|stehen - вставать\n- mit|bringen - приносить с собой\n- fern|sehen - смотреть телевизор\n- an|fangen - начинать\n- ab|holen - забирать\n- um|ziehen - переезжать; переодеваться\n- auf|wachen, ist aufgewacht - просыпаться\n- ab|schreiben - списывать; копировать\n- aus|schalten - выключать\n- an|machen / ein|schalten - включать\n- ab|schließen - запирать, закрывать на ключ\n- aus|füllen - заполнять (бланк)\n- sich an|melden - регистрироваться\n- weg|fahren, ist weggefahren - уезжать\n- auf|hören - заканчивать, прекращать\n- zurück|fahren - возвращаться (на транспорте)\n- sich hin|legen - ложиться\n- aus|schlafen, hat ausgeschlafen - выспаться\n- der Teilnehmer, - - участник\n- die Kursleiterin, -nen - руководитель курса (жен.)\n- das Formular, -e - бланк, форма\n- übersetzen (nicht trennbar) - переводить\n- erklären (nicht trennbar) - объяснять\n- bezahlen (nicht trennbar) - платить\n- besuchen (nicht trennbar) - посещать\n- bekommen (nicht trennbar) - получать\n- verstehen (nicht trennbar) - понимать\n- wiederholen (nicht trennbar) - повторять\n- gefallen (nicht trennbar) - нравиться\n- gehören (nicht trennbar) - принадлежать\n- vermieten (nicht trennbar) - сдавать в аренду\n"}, {"name": "2026-07-20", "text": "# Vocab - 2026-07-20\n\n**Geschmack & Mode (KB S.86-87)**\n- der Geschmack - вкус; мнение о вкусе\n- über Geschmack streiten - спорить о вкусах\n- die Redakteurin, -nen - редактор (жен.)\n- urteilen über + Akk. - судить о чём-либо\n- die Mode - мода\n- die Meinung, -en - мнение\n- das Universum - вселенная\n- schrecklich - ужасный, страшный\n- die Decke, -n - потолок; одеяло; покрывало\n- der Kompromiss, -e - компромисс\n- das Piercing, -s - пирсинг\n- verhindern - предотвращать, мешать\n- das Loch, ¨-er - дырка, отверстие\n- bohren - сверлить, делать отверстие\n- befestigen - прикреплять, закреплять\n- scheußlich - отвратительный\n- der Ohrring, -e - серьга\n- feste Pläne haben - иметь твёрдые планы\n- aufhören (mit + Dat.) - прекращать (что-то делать)\n- verrückt - сумасшедший, безумный\n\n**Beschreibung von Personen (KB S.88-91)**\n- die Handtasche, -n - сумочка\n- der Diebstahl, ¨-e - кража\n- melden - сообщать, заявлять (в полицию)\n- das Polizeirevier, -e - полицейский участок\n- die Lederjacke, -n - кожаная куртка\n- die Haltestelle, -n - остановка (транспорта)\n- aussteigen, ist ausgestiegen - выходить (из транспорта)\n- wegreißen, hat weggerissen - вырывать, срывать\n- wegrennen, ist weggerannt - убегать\n- erkennen, hat erkannt - узнавать (человека)\n- der Bart, ¨-e - борода\n- die Brille, -n - очки\n- schmal - узкий; тонкий\n- rund - круглый\n- der Schal, -s - шарф\n- der Regenschirm, -e - зонт\n- der Kollege, -n - коллега (муж.)\n- die Kollegin, -nen - коллега (жен.)\n- rothhaarig - рыжеволосый\n- der Ohrring, -e - серьга\n- der Hut, ¨-e - шляпа\n- folgen + Dat. - следовать за кем-л.\n- winken - махать (рукой)\n- der Blumenstrauß, ¨-e - букет цветов\n- gratulieren + Dat. - поздравлять кого-л.\n\n**Körperteile (AB S.102)**\n- das Gesicht, -er - лицо\n- das Haar, -e - волос; волосы (Pl.: die Haare)\n- das Auge, -n - глаз\n- das Ohr, -en - ухо\n- die Nase, -n - нос\n- die Wange, -n - щека\n- die Lippe, -n - губа\n- der Zahn, ¨-e - зуб\n- der Hals, ¨-e - горло; шея\n- die Halskette, -n - ожерелье, цепочка\n- der Kopf, ¨-e - голова\n- der Bauch, ¨-e - живот\n- der Finger, - - палец (на руке)\n- der Zeh, -en - палец (на ноге)\n- das Knie, - - колено\n- das Bein, -e - нога\n- der Arm, -e - рука (от плеча)\n- der Mund, ¨-er - рот\n- der Rücken, - - спина\n\n**Adjektivdeklination: Nominativ, Akkusativ, Dativ (AB S.106)**\n- nach definitem Artikel (der/die/das): Nom. -e, Akk. Mask. -en, Dat. -en (alle)\n- nach indefinitem Artikel (ein/eine/ein): Nom. Mask. -er, Neutr. -es; Akk. Mask. -en; Dat. -en (alle)\n- nach Possessivartikel (mein/sein/ihr...): Singular wie indefinit; Plural wie definit\n\n**Fragewörter: welcher / was für ein (AB S.106)**\n- Welcher Schal? → Der graue Schal. (конкретный, уже известный)\n- Was für ein Schal? → Ein grauer Schal. (какой именно / характеристика)\n\n**Verben (Lernwortschatz AB S.107)**\n- kennenlernen - знакомиться\n- leihen, leiht, hat geliehen - одалживать, давать взаймы\n- melden - сообщать, заявлять\n- merken - замечать\n- mit|nehmen, nimmt mit, hat mitgenommen - брать с собой\n- unternehmen, unternimmt, hat unternommen - предпринимать; делать (на отдыхе)\n- verlieren, verliert, hat verloren - терять\n- weg|reißen, reißt weg, hat weggerissen - вырывать\n- wieder|erkennen, erkennt wieder, hat wiedererkannt - узнавать снова\n\n**Nomen (Lernwortschatz AB S.107)**\n- der Badeanzug, ¨-e - купальник\n- das Briefpapier - писчая бумага\n- das Büro, -s - офис, бюро\n- der Diebstahl, ¨-e - кража\n- das Kartenspiel, -e - карточная игра\n- das Kopfkissen, - - подушка\n- die Laune, -n - настроение\n- das Medikament, -e - лекарство\n- das Mittel, - - средство\n- der Tennisschläger, - - теннисная ракетка\n- die Zeitschrift, -en - журнал\n\n**Adjektive (Lernwortschatz AB S.107)**\n- aggressiv - агрессивный\n- betrunken - пьяный\n- blöd - глупый, тупой\n- fremd - чужой, незнакомый\n- lächerlich - смешной, нелепый\n- neugierig - любопытный\n- toll - классный, отличный\n- überall - везде, повсюду\n- unpünktlich - непунктуальный\n\n**Wörter im Kontext (AB S.107)**\n- Es geht jdm. auf die Nerven - кто-то действует кому-то на нервы\n- seine Ruhe haben wollen - хотеть покоя\n- ein starkes Parfüm benutzen - пользоваться сильным парфюмом\n- einen Diebstahl melden - сообщить о краже\n- viel unternehmen - много делать, активно проводить время\n- aus|borgen (österr.) = leihen - одалживать (австр.)\n"}, {"name": "2026-08-16", "text": "# Vocab — 16.08.2026 (KB 106, AB 118–122)\n\n---\n\n## Возвратные глаголы / Reflexive Verben (AB стр. 118–119, 122)\n\n- sich waschen (wäscht sich) — мыться\n- sich kämmen — причёсываться\n- sich rasieren — бриться\n- sich anziehen — одеваться\n- sich setzen — садиться\n- sich anschauen — смотреть на себя (в зеркало)\n- sich stellen — вставать, ставить себя\n- sich legen — ложиться\n- sich verstecken — прятаться\n\n**Reflexivpronomen (Akkusativ):**\nich → mich / du → dich / er/sie/es → sich / wir → uns / ihr → euch / sie/Sie → sich\n\n---\n\n## Глаголы с предлогами / Verben mit Präpositionen (KB стр. 106, AB стр. 120–122)\n\n*Präposition + Akkusativ:*\n- denken an + Akk — думать о\n- warten auf + Akk — ждать\n- demonstrieren für + Akk — демонстрировать за\n- berichten über + Akk — сообщать о\n- sich vorbereiten auf + Akk — готовиться к\n- sich freuen über + Akk — радоваться чему-то\n\n*Präposition + Dativ:*\n- teilnehmen an + Dat — участвовать в\n- helfen bei + Dat — помогать с\n- fragen nach + Dat — спрашивать о\n- sprechen mit + Dat — говорить с\n- sich erkundigen nach + Dat — узнавать/справляться о\n- sich bewerben um + Akk — подавать заявку на (работу)\n- sich ärgern über + Akk — злиться на/из-за\n- sich beschweren über + Akk — жаловаться на\n- sich interessieren für + Akk — интересоваться чем-то\n- sich kümmern um + Akk — заботиться о\n\n---\n\n## Профессии / Berufe (AB стр. 120)\n\n- der Lehrer / die Lehrerin — учитель\n- der Arbeiter / die Arbeiterin — рабочий\n- der Praktikant / die Praktikantin — практикант\n- der Patient / die Patientin — пациент\n- der Student / die Studentin — студент\n- der Manager / die Managerin — менеджер\n- die Marktfrau / der Marktmann — продавец на рынке\n- der Abiturient / die Abiturientin — выпускник(ца) школы\n- die Sekretärin — секретарь\n\n---\n\n## Lernwortschatz — существительные / Nomen (AB стр. 122)\n\n- r Arbeiter, – — рабочий\n- e Ausbildung, -en — образование, обучение\n- e Ausstellung, -en — выставка\n- r Berufsweg, -e — карьерный путь\n- e Bestellung, -en — заказ\n- r Export — экспорт\n- e Grammatik, -en — грамматика\n- s Kochbuch, ¨er — кулинарная книга\n- e Lehrstelle, -n — ученическое место (стажировка)\n- e Lieferung, -en — доставка, поставка\n- r Lohn, ¨e — зарплата (рабочего)\n- r Manager, – — менеджер\n- e Marktfrau, -en — торговка на рынке\n- r Praktikant, -en — практикант\n- e Sendung, -en → Sportsendung — передача / спортивная передача\n- e Sportsendung, -en — спортивная передача\n- e Unfreundlichkeit — грубость, недружелюбие\n- e Verspätung, -en — опоздание\n- e Wartezeit, -en — время ожидания\n\n---\n\n## Lernwortschatz — глаголы / Verben (AB стр. 122)\n\n- sich ärgern — злиться\n- sich beschweren — жаловаться\n- sich bewerben (bewirbt, hat beworben) — подавать заявку\n- demonstrieren — демонстрировать\n- sich erkundigen — узнавать, справляться\n- sich interessieren — интересоваться\n- teil·nehmen (nimmt teil, hat teilgenommen) — участвовать\n- sich unterhalten (unterhält, hat unterhalten) — беседовать, развлекаться\n"}, {"name": "2026-08-20", "text": "# Vocab — 20.08.2026 (KB 108–109, AB 123–128)\n\n---\n\n## Genitiv — артикли / Artikel\n\n| | Nominativ | Genitiv |\n|---|---|---|\n| Mask. | **der** Doktor | **des** Doktors |\n| Fem. | **die** Familie | **der** Familie |\n| Neutr. | **das** Hotel | **des** Hotels |\n| Pl. | **die** Banken | **der** Banken |\n\n- Mask./Neutr. → существительное получает окончание **-(e)s**\n- Fem./Pl. → существительное не меняется\n- Неопределённый артикль: **eines** Doktors / **einer** Familie / **eines** Hotels\n- Pl. без артикля → **von** + Dat: Kredite **von** Banken\n\n---\n\n## Предлоги с временным значением / Präpositionen temporal\n\n- **vor** + Dat — назад (vor drei Jahren — три года назад)\n- **nach** + Dat — после (nach dem Abitur — после абитура)\n- **von ... bis** — с ... до (von 2005 bis 2007)\n- **zwischen** + Dat — между (zwischen Januar und Juni)\n- **seit** + Dat — с ... (и до сих пор) (seit dem 1. Juli)\n- **in** + Dat — через (in einem Jahr — через год)\n\n---\n\n## Новые глаголы с предлогами / Neue Verben mit Präpositionen\n\n*+ Akkusativ:*\n- sich erinnern an + Akk — вспоминать о *(возвр.)*\n- sich bedanken für + Akk — благодарить за *(возвр.)*\n- sich entscheiden für + Akk — решать в пользу / выбирать *(возвр.)*\n- bitten um + Akk — просить о (nicht reflexiv)\n- stolz sein auf + Akk — гордиться чем-то\n\n*+ Dativ:*\n- passen zu + Dat — подходить к/для\n\n---\n\n## Лексика по теме / Wortschatz\n\n- s Abiturtreffen, – — встреча выпускников\n- r Abiturjahrgang, -¨e — выпуск (год окончания школы)\n- ehemalig — бывший\n- s Stipendium, -ien — стипендия\n- s Staatsexamen, – — государственный экзамен\n- e Auslandsabteilung, -en — международный отдел\n- e Konferenz, -en — конференция\n- e Einladung, -en — приглашение\n- e Entschuldigung, -en — извинение\n- e Mitteilung, -en — сообщение\n- e Zusage, -n — подтверждение, согласие\n- r Direktor / e Direktorin — директор\n- r Komponist, -en — композитор\n- bestehen (bestand, hat bestanden) — сдать (экзамен); выдержать\n- übernehmen (übernahm, hat übernommen) — перенять, взять на себя\n- neugierig — любопытный\n- befristet — временный (о контракте)\n"}, {"name": "2026-09-09", "text": "# Vocab — 2026-09-09\n\n**Das Haus an den Klippen — Kapitel 2 \"Die Freundschaft\" (стр. 18–30)**\n- die Freundschaft(-en) — дружба\n- jdn. begleiten — сопровождать кого-л.\n- verschieden — разный, различный\n- der Schrott — металлолом, хлам (перен. «мусор»)\n- sich verändern — меняться\n- übers ganze Gesicht strahlen — сиять всем лицом\n- der Mut — смелость\n- unruhig — беспокойный, нервный\n- überzeugt sein — быть уверенным\n- der Blick(-e) — взгляд\n- spitz — острый; здесь: колкий, язвительный\n- die Klamotten (жарг.) — шмотки, одежда\n- sich auskennen mit etw. — хорошо разбираться в чём-л.\n- der Mittelpunkt(-e) — центр (внимания)\n- eifersüchtig auf jdn. sein — ревновать к кому-л.\n- ausgeschnitten sein — быть с вырезом (об одежде)\n- schüchtern — застенчивый\n- furchtbar — ужасный\n- nett — милый, приятный\n- langweilig — скучный\n- die Geduld — терпение\n- anders sein (als) — отличаться (от)\n- sich verschieden sein (von) — быть разными (друг от друга)\n- einander — друг друга\n- sich (Dat.) etw. vorstellen — представлять себе что-л.\n\n**Grammatik: einander / Reflexivpronomen**\n- sich sehen ↔ einander sehen — видеть друг друга\n- Präpositionen + einander: voneinander, miteinander, füreinander, hintereinander …\n\n**Kursbuch S. 116–119 — Kapitel 24 \"Fokus Sprechen\"**\n- winken — махать\n- sinken, sinkt, ist gesunken — тонуть, опускаться\n- springen, springt, ist gesprungen — прыгать\n- trinken, trinkt, hat getrunken — пить\n- der Enkel(-) — внук\n- die Tante(n) — тётя\n- der Onkel(-) — дядя\n- der Sänger(-) — певец\n- der Angler(-) — рыболов (удочкой)\n- fangen, fängt, hat gefangen — ловить\n- der Genitiv — родительный падеж (der Wagen ihres Vaters — машина её отца)\n- der Reim(e) — рифма\n- das Ufer(-) — берег\n- der Fluss(¨e) — река\n- der Bach(¨e) — ручей\n- die Anzeige(n) — объявление\n- sich bewerben (um), bewirbt sich, hat sich beworben — подавать заявку, устраиваться на работу\n- selbstständig — самостоятельно\n- die Aufstiegsmöglichkeit(en) — возможность карьерного роста\n- das Gehalt(¨er) — зарплата\n\n**Arbeitsbuch Kapitel 24 (стр. 136–140)**\n- die Anmeldung(en) — регистрация, запись\n- das Geschenk(e) — подарок\n- die Aufregung(en) — волнение\n- das Getränk(e) — напиток\n- die Begrüßung(en) — приветствие\n- die Erinnerung(en) — воспоминание\n- die Bewerbung(en) — заявление о приёме на работу\n- die Vorbereitung(en) — подготовка\n- der Großvater / die Großmutter — дедушка / бабушка\n- die Enkelin(nen) — внучка\n- die Nichte(n) / der Neffe(n) — племянница / племянник\n- das Personalpronomen / das Reflexivpronomen — личное / возвратное местоимение\n- der Genitiv -es (bei einsilbigen Nomen) — окончание -es в род. падеже у односложных существительных (des Mannes, des Hauses)\n- sich leisten (etw.) — позволить себе (что-л.)\n- der Kontakt(-e) — контакт\n- der Stress — стресс\n- die Verantwortung(en) — ответственность\n- körperlich — физический\n- sympathisch — симпатичный\n"}, {"name": "2026-09-20", "text": "# Vocab — 2026-09-20\n\n**Kursbuch S. 129–131 — Kapitel 26 (Präteritum, Zeitungsmeldungen, Aberglaube)**\n- der Pilz(e) — гриб\n- essbar / giftig — съедобный / ядовитый\n- die Pilzvergiftung(en) — отравление грибами\n- Bauchweh / die Bauchschmerzen (Pl.) — боль в животе\n- der Notdienst(e) — служба экстренной помощи\n- das Kleeblatt(¨er) (vierblättrig) — клеверный лист (четырёхлистный)\n- Glück/Pech bringen — приносить удачу/неудачу\n- das Hufeisen(-) — подкова\n- der Spiegel(-) (zerbrechen) — зеркало (разбить)\n- der Schornsteinfeger(-) — трубочист\n- der Aberglaube (nur Sg.) — суеверие\n- Präteritum (starke Verben): fand, wusste, grub, sah, gab, berichtete, stieß, stand — сильные глаголы в претерите\n\n**Arbeitsbuch S. 147–152 — Anker (Kap. 25) + Kapitel 26**\n- die Schlagzeile(n) — заголовок (газетный)\n- der Rekord(e) — рекорд\n- sich verlieben (in + Akk), verliebte sich, hat sich verliebt — влюбиться\n- die Karriere(n) — карьера\n- die Aufstiegsmöglichkeit(en) — возможность карьерного роста (повтор)\n- die Alltagstätigkeit(en) — повседневное занятие\n- die Zugehörigkeit / der Besitz — принадлежность / собственность\n- aus + Material (eine Dose aus Metall) — сделано из чего-л.\n- für + Zweck (eine Dose für Kaffee) — предназначено для чего-л.\n- Perfekt-Wiederholung: fahren-fuhr-ist gefahren, finden-fand-hat gefunden, rufen-rief-hat gerufen, steigen-stieg-ist gestiegen\n\n**Das Haus an den Klippen — Kapitel 3 \"Das Fest\" (стр. 31–43)**\n- das Fest(e) — праздник, вечеринка\n- die Eistorte(n) — торт-мороженое\n- sich schminken — краситься, делать макияж\n- ungeschminkt — без макияжа\n- das Band(¨er) — лента\n- erleuchtet — освещённый\n- die Frisur(en) — причёска\n- toll — классный, потрясающий\n- der Schrei(e) — крик\n- schreien, schrie, hat geschrien — кричать\n- entsetzlich — ужасающий\n- der Teufel(-) — чёрт, дьявол\n- ununterbrochen — непрерывно\n- jdn. anstarren — пристально смотреть на кого-л.\n- das Gerede (nur Sg.) — пустая болтовня\n- plätschern — журчать, плескаться\n- die Klippe(n) — утёс, скала\n- spuken — являться в виде привидения (о доме — «там нечисто»)\n- das Gespenst(er) — привидение\n- die Hexe(n) — ведьма\n- der Spuk (nur Sg.) — наваждение, нечисть\n- das Geheimnis(se) — тайна\n- die Angst(¨e) — страх\n- der Partymuffel(-) — тот, кто не любит вечеринки\n- überfluten — затоплять\n- die Flut(en) / die Ebbe(n) — прилив / отлив\n- der Deich(e) — дамба\n"}, {"name": "2026-09-24", "text": "# Vocab — 2026-09-24\n\n**Kursbuch S. 134–135 — Kapitel 27 «Ein glücklicher Pechvogel» (als/während/obwohl)**\n- der Pechvogel(¨) / der Glückspilz(e) — неудачник / везунчик\n- die Panne(n) — авария, поломка\n- absägen (Ast) — отпиливать (ветку)\n- ausrutschen, rutschte aus, ist ausgerutscht — поскользнуться\n- stoßen (gegen + Akk), stieß, hat gestoßen — удариться обо что-л.\n- das Regal(e) — полка, стеллаж\n- die Wasserleitung(en) — водопровод\n- der Elektriker(-) — электрик\n- defekt — неисправный\n- der Rasen (nur Sg.) — газон\n- stecken bleiben, blieb stecken, ist steckengeblieben — застрять\n- abmontieren — снять, демонтировать\n- befreien — освобождать\n- der Dachboden(¨) — чердак\n- ins Schloss fallen — захлопнуться (о двери)\n- der Briefträger(-) — почтальон\n- die Briefmarke(n) — почтовая марка\n- kennenlernen, lernte kennen, hat kennengelernt — познакомиться\n\n**Arbeitsbuch S. 155–159 — Kapitel 27 (Präteritum/Perfekt, Nebensätze с als/wenn/während/wann)**\n- der Hilferuf(e) — крик о помощи\n- der Wurm(¨er) — червяк\n- der Hase(n) — заяц\n- der Zaun(¨e) — забор\n- das Feuer(-) — огонь\n- husten — кашлять\n- verbinden (Wunde), verband, hat verbunden — перевязывать (рану)\n- eincremen — намазать кремом\n- klingeln — звонить (в дверь)\n- der Notrufschalter(-) — кнопка экстренного вызова\n- drücken (auf + Akk) — нажимать (на что-л.)\n- sich beugen — наклоняться\n- steigen, stieg, ist gestiegen — подниматься\n- schweigen, schwieg, hat geschwiegen — молчать\n- leihen, lieh, hat geliehen — одалживать\n- verzeihen, verzieh, hat verziehen — прощать\n- entscheiden, entschied, hat entschieden — решать\n- greifen, griff, hat gegriffen — хватать\n- reiten, ritt, ist geritten — скакать верхом\n- streiten, stritt, hat gestritten — ссориться\n- reißen, riss, hat/ist gerissen — рвать(ся)\n- streichen, strich, hat gestrichen — красить\n- Grammatik: als (однократно в прошлом) / wenn (повторяющееся, наст./буд.) / während (одновременность, «пока») / wann (вопрос «когда»)\n"}, {"name": "2026-09-27", "text": "# Vocab — 2026-09-27\n\n**Das Haus an den Klippen, Kapitel 4 (Markus)**\n- e Klippe, -n — скала, утёс\n- s Pärchen, - — парочка\n- der/die feste Freund/in — постоянный молодой человек / девушка\n- verrückt sein nach jmdm. — быть без ума от кого-то\n- s Zeug — барахло, чепуха\n- begeistert (sein von) — быть в восторге (от)\n- der Einzelgänger, - — одиночка\n- verwuschelt — взъерошенный, растрёпанный\n- durcheinander sein — быть в смятении, растерянным\n- klingeln — звонить (о телефоне/звонке)\n- sich unterhalten — общаться, беседовать\n- geheimnisvoll — таинственный\n- der Schrei, -e — крик\n- der Vorschlag, ¨e — предложение\n- die Anzeige, -n — объявление (о знакомстве)\n- schüchtern — робкий, застенчивый\n- eigenartig — странный, своеобразный\n\n**Kursbuch S.136-139 (Fokus Hören — Kapitel 28)**\n- die Meldung, -en — сообщение, известие\n- der Lokalfunk — местное радио\n- das Verbrechen, - — преступление\n- der Selbstmord, -e — самоубийство\n- der Unfall, ¨e — авария, несчастный случай\n- die Bundesstraße, -n — федеральная трасса\n- die Umleitung, -en — объезд\n- der Überfall, ¨e — нападение\n- die Schusswaffe, -n — огнестрельное оружие\n- der/die Angeklagte, -n — обвиняемый/обвиняемая\n- der Richter, - — судья\n- neblig — туманный\n- glatt — скользкий\n- bremsen — тормозить\n\n**Arbeitsbuch Kapitel 28 (Präteritum gemischte Verben & Präpositionen mit Genitiv)**\n- kennen – kannte — знать\n- brennen – brannte — гореть\n- rennen – rannte — бежать, мчаться\n- nennen – nannte — называть\n- denken – dachte — думать\n- bringen – brachte — приносить\n- wegen + Gen. — из-за\n- während + Gen. — во время, в течение\n- trotz + Gen. — несмотря на\n- die Panne, -n — поломка, авария (техническая)\n- der Streik, -s — забастовка\n- das Parlament, -e — парламент\n- die Sitzung, -en — заседание\n- die Sparkasse, -n — сберкасса\n- der Dachdecker, - — кровельщик }
function pickWords(mode, size) {
  const now = Date.now(), pool = activeWords();
  const due = [], fresh = [], rest = [];
  for (const w of pool) {

    if (st === 'new') fresh.push(w);
    else if (p.due <= now) due.push(w); else rest.push(w);
  }
  due.sort((a, b) => getP(a.key).due - getP(b.key).due);
  if (mode === 'new') return newOrder(fresh).slice(0, size);
  if (mode === 'weak') {
    return pool.filter(w => { const p = getP(w.key); return p.seen > 0 && (p.box <= 1 || p.bad > p.ok); })
      .sort((a, b) => getP(a.key).box - getP(b.key).box || getP(b.key).bad - getP(a.key).bad).slice(0, size);
  }
  const nNew = Math.min(S.settings.newMax, fresh.length, size);
  const nDue = Math.min(due.length, size - nNew);
  const newList = newOrder(fresh);
  const taken = new Set();
  let out = [];
  const take = list => { for (const w of list) { if (out.length >= size) break; if (!taken.has(w.key)) { taken.add(w.key); out.push(w); } } };
  take(due.slice(0, nDue));                       // 1) пора повторять (в т.ч. прошлые ошибки)
  take(newList.slice(0, nNew));                   // 2) порция new слов
  const fresh12h = now - 12 * 3600 * 1000;
  const restOld = rest.filter(w => getP(w.key).last < fresh12h)
    .sort((a, b) => getP(a.key).box - getP(b.key).box || getP(a.key).last - getP(b.key).last);
  take(restOld);                                  // 3) слова из прошлых дней, ещё не выученные
  take(newList);                                  // 4) если всё ещё мало — ещё новые слова
  take(rest.slice().sort((a, b) => getP(a.key).box - getP(b.key).box || getP(a.key).last - getP(b.key).last)); // 5) крайний случай

function startSession(mode, kind, words) {

}
function gradeWord(item, ok, opts = {}) {      // упражнение: запись прогресса по первой попытке
  if (item.tries > 0) return;
  const p = setP(item.w.key);
  p.seen++; logAnswer(ok && !opts.hinted);
  if (ok && !opts.hinted) {
    p.ok++; p.streak = (p.streak || 0) + 1; SES.firstOk++;

  else { SES.queue.shift(); SES.queue.splice(Math.min(3, SES.queue.length), 0, item); }
  if (!SES.queue.length) { go('summary'); return; }
  render();
}

/* ---------- выбор типа упражнения ---------- */
const TIER = { mc_de_ru: 1, mc_ru_de: 1, article: 1, listen: 1, plural: 2, verbforms: 2, scramble: 2, gap: 2, type: 3, order: 3 };
function applicable(w) {
  const t = [];
  if (w.phrase) return ['mc_de_ru', 'order', 'order'];
  const b = base(w);
  t.push('mc_de_ru', 'mc_ru_de');
  if (w.article) t.push('article');
  if (w.article && pluralWord(w) && pluralWord(w) !== b && !trivialPlural(w)) t.push('plural');
  if (w.pos === 'verb' && /^(hat|ist)\s+\S+$/.test(w.forms[w.forms.length - 1])) t.push('verbforms');
  const letters = b.replace(/[^A-Za-zÄÖÜäöüß]/g, '').length;
  if (w.typable && letters >= 3) {
    if (!/\s/.test(b) && b.length <= 14) t.push('scramble');
    if (!/\s/.test(b) && b.length <= 18 && letters >= 4) t.push('gap');
    t.push('type');
  }
  if (speakable()) t.push('listen');
  return t;
}
function chooseType(item) {
  const w = item.w, p = getP(w.key);
  const tier = item.tries > 0 ? 1 : (p.seen === 0 ? 1 : p.box <= 1 ? 1.6 : p.box <= 3 ? 2.3 : 3);
  const opts = applicable(w).filter(t => t !== SES.lastType);
  const pool = opts.length ? opts : applicable(w);
  const weights = pool.map(t => Math.exp(-Math.abs(TIER[t] - tier) * 1.4));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}

}

/* ---------- варианты ответа (общая функция) ---------- */
function distractors(w, getText, n = 3) {
  const same = VOCAB.filter(x => x.key !== w.key && !!x.article === !!w.article && !x.phrase === !w.phrase);
  const topic = same.filter(x => x.files[0] === w.files[0]);
  const cand = shuffle(topic).concat(shuffle(same));
  const out = [], seen = new Set([getText(w).toLowerCase()]);
  for (const x of cand) {
    const t = getText(x), k = t.toLowerCase();
    if (seen.has(k) || t.length > 70) continue;
    seen.add(k); out.push(t);
    if (out.length === n) break;
  }
  return out;
}
function choiceUI(ctx, { prompt, sub, options, correct, onAfter, speak }) {

    btns.forEach((b, j) => { b.disabled = true; if (opts[j] === correct) b.classList.add('right'); });
    if (!ok) btns[i].classList.add('wrong');
    if (onAfter) onAfter();
    ctx.finish(ok);
  };
  card.append(h('div', { class: 'tag' }, sub || ''), prompt, h('div', { class: 'opts' },
    opts.map((o, i) => { const b = h('button', { class: 'opt', onclick: ev => pickIt(i, ev) }, h('span', { class: 'k' }, i + 1), h('span', null, o)); btns.push(b); return b; })));
  KEYS = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= opts.length) pickIt(n - 1); };

const bigWord = (w, text) => h('div', { class: 'big-word' }, text || fullDe(w), ' ', speakBtn(base(w)));

/* ---------- упражнения ---------- */
const RENDERERS = {
  mc_de_ru(ctx) {
    const { w } = ctx;
    choiceUI(ctx, {
      sub: 'Übersetzung wählen', prompt: w.phrase ? h('div', { class: 'big-word sentence' }, w.lemma, ' ', speakBtn(w.lemma)) : bigWord(w),
      options: [w.ru, ...distractors(w, x => x.ru)], correct: w.ru
    });
  },
  mc_ru_de(ctx) {
    const { w } = ctx;
    choiceUI(ctx, {
      sub: 'Wie sagt man das auf Deutsch?', prompt: h('div', { class: 'big-word' }, w.ru),
      options: [fullDe(w), ...distractors(w, fullDe)], correct: fullDe(w)
    });
  },
  listen(ctx) {
    const { w } = ctx;
    choiceUI(ctx, {
      sub: 'Hören und Übersetzung wählen',
      prompt: h('div', { class: 'big-word' }, h('button', { class: 'btn bigspeak', onclick: () => speak(base(w)) }, '🔊 Anhören')),
      options: [w.ru, ...distractors(w, x => x.ru)], correct: w.ru, speak: () => setTimeout(() => speak(base(w)), 150)
    });
  },
  article(ctx) {
    const { w } = ctx;

      sub: 'Welcher Artikel?', prompt: h('div', { class: 'big-word' }, '___ ', w.lemma, h('div', { class: 'ru-sub' }, w.ru)),
      options: ['der', 'die', 'das'], correct: w.article
    });
  },
  plural(ctx) {
    const { w } = ctx, b = base(w), right = pluralWord(w);
    const wrong = plausibleWrong(b, right).slice(0, 3);

      sub: 'Plural wählen', prompt: h('div', { class: 'big-word' }, fullDe(w), h('div', { class: 'ru-sub' }, w.ru)),
      options: ['die ' + right, ...wrong.map(x => 'die ' + x)], correct: 'die ' + right

  },
  verbforms(ctx) {
    const { w } = ctx, right = w.forms[w.forms.length - 1];
    const others = shuffle(VOCAB.filter(x => x.forms && x.key !== w.key && x.forms[x.forms.length - 1] !== right)).map(x => x.forms[x.forms.length - 1]);
    const wrong = [...new Set(others)].slice(0, 3);

      sub: 'Partizip II (Perfekt)', prompt: h('div', { class: 'big-word' }, w.lemma, h('div', { class: 'ru-sub' }, w.ru)),

    let built = [], hinted = false;
    const area = h('div', { class: 'slots' }), bankEl = h('div', { class: 'tiles' }), msg = h('div', { class: 'muted' });
    const checkBtn = h('button', { class: 'btn primary', onclick: check }, 'Prüfen');
    function draw() {
      area.replaceChildren(...built.map((t, i) => h('button', { class: 'tile in', onclick: () => { built.splice(i, 1); bank.push(t); draw(); } }, t.c)),
        ...Array.from({ length: bank.length }, () => h('span', { class: 'tile empty' })));
      bankEl.replaceChildren(...bank.map(t => h('button', { class: 'tile', onclick: () => { bank.splice(bank.indexOf(t), 1); built.push(t); draw(); } }, t.c)));

    }

    function hint2() {

      const t = bank.find(x => x.c === b[i]); if (!t) return;

      }));
      bankEl.replaceChildren(...bank.map(t => h('button', { class: 'tile', onclick: () => { const j = fill.indexOf(null); if (j < 0) return; fill[j] = t; bank.splice(bank.indexOf(t), 1); draw(); } }, t.c)));

      draw();
    }
    card.append(h('div', { class: 'tag' }, 'Fehlende Buchstaben ergänzen'), h('div', { class: 'big-word' }, w.ru, h('div', { class: 'ru-sub' }, lemmaHint(w))),
      wordEl, bankEl, h('div', { class: 'btnrow' }, checkBtn, h('button', { class: 'btn', onclick: hint }, '💡 Tipp')));
    draw();
  },

  type(ctx) {
    const { w, card } = ctx, b = base(w);
    let buf = '', hinted = false;
    const out = h('div', { class: 'typed' }), msg = h('div', { class: 'muted small' }, 'ä = ae oder a: · ö = oe oder o: · ü = ue oder u: · ß = ss');
    const checkBtn = h('button', { class: 'btn primary', onclick: check }, 'Prüfen');
    const norm = VocabParser.normAnswer;
    function draw() { out.textContent = buf; out.append(h('span', { class: 'caret' })); }
    function add(c) { buf += c; draw(); }
    function back() { buf = buf.slice(0, -1); draw(); }
    function check() {
      if (!buf.trim()) return;
      const u = norm(buf);
      const ok = u === norm(b) || (w.article && u === norm(w.article + b));
      out.classList.add(ok ? 'good' : 'bad'); KEYS = null;
      card.querySelectorAll('button').forEach(x => x.disabled = true);
      ctx.finish(ok, { hinted });
    }
    function hint() {
      hinted = true;
      let i = 0; const nb = b.toLowerCase();
      while (i < buf.length && i < nb.length && buf[i].toLowerCase() === nb[i]) i++;
      buf = b.slice(0, i + 1); draw();
    }
    const rows = [['q', 'w', 'e', 'r', 't', 'z', 'u', 'i', 'o', 'p', 'ü'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ö', 'ä'], ['y', 'x', 'c', 'v', 'b', 'n', 'm', 'ß', '⌫']];
    const kb = h('div', { class: 'kb' }, rows.map(r => h('div', { class: 'kbrow' }, r.map(k =>
      h('button', { class: 'key' + (/[äöüß]/.test(k) ? ' sp' : '') + (k === '⌫' ? ' wide' : ''), onclick: () => k === '⌫' ? back() : add(k) }, k)))),
      h('div', { class: 'kbrow' }, h('button', { class: 'key spaceKey', onclick: () => add(' ') }, 'Leertaste')));
    card.append(h('div', { class: 'tag' }, 'Auf Deutsch schreiben'), h('div', { class: 'big-word' }, w.ru, h('div', { class: 'ru-sub' }, lemmaHint(w))),
      out, kb, h('div', { class: 'btnrow' }, checkBtn, h('button', { class: 'btn', onclick: hint }, '💡 Tipp')), msg);
    draw();
    KEYS = e => {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
      else if (e.key === 'Backspace') { e.preventDefault(); back(); }
      else if (e.key.length === 1) { e.preventDefault(); add(e.key); }
    };
  },

  order(ctx) {
    const { w, card } = ctx;
    const toks = w.lemma.split(/\s+/).map((c, i) => ({ c, id: i }));
    let bank = shuffle(toks); let t = 0;
    while (bank.map(x => x.c).join(' ') === w.lemma && t++ < 9) bank = shuffle(toks);
    let built = [], hinted = false;
    const area = h('div', { class: 'words' }), bankEl = h('div', { class: 'tiles words' });
    const checkBtn = h('button', { class: 'btn primary', onclick: check }, 'Prüfen');
    function draw() {
      area.replaceChildren(...built.map((x, i) => h('button', { class: 'tile wide in', onclick: () => { built.splice(i, 1); bank.push(x); draw(); } }, x.c)));
      if (!built.length) area.append(h('span', { class: 'muted' }, 'Wörter der Reihe nach antippen'));
      bankEl.replaceChildren(...bank.map(x => h('button', { class: 'tile wide', onclick: () => { bank.splice(bank.indexOf(x), 1); built.push(x); draw(); } }, x.c)));
      checkBtn.disabled = bank.length > 0;
    }
    function check() {
      const ok = built.map(x => x.c).join(' ').toLowerCase() === w.lemma.toLowerCase();
      area.classList.add(ok ? 'good' : 'bad');
      card.querySelectorAll('button').forEach(x => x.disabled = true);
      ctx.finish(ok, { hinted });
    }
    function hint() {
      hinted = true;
      const correct = w.lemma.split(/\s+/);
      let i = 0; while (i < built.length && built[i].c === correct[i]) i++;
      if (i < built.length) bank = bank.concat(built.splice(i));
      const x = bank.find(y => y.c === correct[i]); if (!x) return;
      bank.splice(bank.indexOf(x), 1); built.push(x); draw();
    }
    card.append(h('div', { class: 'tag' }, 'Satz bilden'), h('div', { class: 'big-word sentence' }, w.ru),
      area, bankEl, h('div', { class: 'btnrow' }, checkBtn,
        h('button', { class: 'btn', onclick: () => { bank = bank.concat(built); built = []; draw(); } }, 'Zurücksetzen'),
        h('button', { class: 'btn', onclick: hint }, '💡 Tipp')));
    draw();
  }
};

/* ============================ ИТОГИ ============================ */
