<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vokabeltrainer</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#6a7385;--line:#e3e6ec;--pri:#2f6fed;--pri-ink:#fff;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#fff4d6;--tile:#eef1f6;--shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--line:#2a3147;--pri:#5a8dff;--pri-ink:#0b1020;--ok:#3ac17a;--okbg:#14301f;--bad:#ff7070;--badbg:#3a1b1d;--warn:#3a3114;--tile:#262d42;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 60px}
.top{display:flex;align-items:center;gap:10px;padding:10px 2px}
.top .title{font-weight:700;font-size:18px;flex:1}.top .title.big{font-size:26px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{padding:18px}.h2{font-weight:700;font-size:17px;margin-bottom:8px}.pct{font-weight:800;font-size:22px;color:var(--pri)}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}
.muted{color:var(--mut);font-size:14px;margin-top:6px}.small{font-size:12.5px}
.bar{height:8px;background:var(--tile);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}.bar.big{height:12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--tile);border-radius:12px;padding:8px 4px;text-align:center}.stat .n{font-weight:800;font-size:20px}.stat .l{font-size:11.5px;color:var(--mut)}
.stat.known .n{color:var(--ok)}.stat.new .n{color:var(--pri)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;min-height:46px}
.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:transparent;width:100%;font-size:17px}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btnrow .btn{flex:1;min-width:110px}
.nav{display:flex;gap:8px}.nav .btn{flex:1}
.link{background:none;border:0;color:var(--pri);padding:4px 2px;font-size:14px;text-decoration:underline}.link.danger{color:var(--bad);margin-top:10px}
.icon{background:var(--tile);border:1px solid var(--line);border-radius:10px;min-width:38px;height:38px;font-size:17px;padding:0 8px}
.mini{background:var(--tile);border:1px solid var(--line);border-radius:8px;min-width:34px;height:34px;font-size:15px}
.files{display:flex;flex-direction:column;gap:2px}
.file{display:grid;grid-template-columns:22px 100px 1fr 54px;white-space:nowrap;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.file input{width:18px;height:18px}.fcount{text-align:right;color:var(--mut);font-size:13px}.fname{font-variant-numeric:tabular-nums}
.warn{background:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.ex{min-height:220px}.tag{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.big-word{font-size:28px;font-weight:700;line-height:1.25;margin:6px 0 14px;word-break:break-word}.big-word.sentence{font-size:22px}
.ru-sub{font-size:15px;font-weight:500;color:var(--mut);margin-top:4px}
.opts{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--tile);border:2px solid transparent;border-radius:12px;padding:13px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt .k{background:var(--card);border-radius:6px;min-width:22px;height:22px;text-align:center;font-size:12px;line-height:22px;color:var(--mut);flex:none;padding:0 5px}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 16px;margin:12px 0;border:2px solid}.fb[hidden]{display:none}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fbhead{font-weight:800;font-size:17px;margin-bottom:4px}.fb.ok .fbhead{color:var(--ok)}.fb.bad .fbhead{color:var(--bad)}
.ans{font-size:22px;font-weight:700}.fb .ru{font-size:17px}
.skip{text-align:center;margin-top:6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.slots,.gapword,.words{display:flex;flex-wrap:wrap;gap:6px;min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;align-items:center}
.slots.good,.gapword.good,.words.good,.typed.good{border-color:var(--ok);background:var(--okbg)}.slots.bad,.gapword.bad,.words.bad,.typed.bad{border-color:var(--bad);background:var(--badbg)}
.tile{min-width:42px;height:46px;padding:0 10px;background:var(--tile);border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700}
.tile.wide{font-size:17px;height:44px}.tile.in{background:var(--pri);color:var(--pri-ink);border-color:transparent}.tile.empty{background:transparent;border:2px dashed var(--line);cursor:default}
.tile.slot{min-width:38px}.gl{font-size:26px;font-weight:700;padding:0 2px}.gapword{border:0;padding:0;min-height:0;margin:10px 0}
.typed{min-height:54px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font-size:24px;font-weight:700;letter-spacing:.03em;margin:8px 0;word-break:break-all}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--pri);vertical-align:-3px;margin-left:2px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.kb{margin:10px 0}.kbrow{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
.key{flex:1;max-width:48px;height:46px;background:var(--tile);border:1px solid var(--line);border-radius:8px;font-size:19px;font-weight:600;padding:0}.key.sp{background:var(--pri);color:var(--pri-ink);border-color:transparent}.key.wide{max-width:70px}.key.spaceKey{max-width:260px;font-size:14px;font-weight:500}
.cardface{cursor:pointer;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center}.cardface .big-word{font-size:32px}.cardface .big-word.ru{color:var(--pri)}.cardface hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.grades{display:grid;gap:8px;margin-top:10px}.grades[hidden],.back[hidden]{display:none}
.g1{background:var(--badbg);border-color:var(--bad)}.g2{background:var(--warn)}.g3{background:var(--okbg);border-color:var(--ok)}
.grades .k{display:inline-block;background:var(--card);border-radius:6px;min-width:22px;text-align:center;font-size:12px;margin-right:6px}
.bigspeak{font-size:20px;padding:16px 22px}.miss{padding:5px 0;border-bottom:1px solid var(--line)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.row.gap .inp{flex:1}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.iw{font-weight:700}.ipl{font-weight:400;color:var(--mut);font-size:14px}.ir{font-size:15px}
.iact{display:flex;gap:5px;align-items:center;flex:none}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--tile);color:var(--mut);white-space:nowrap}.chip.known{background:var(--okbg);color:var(--ok)}.chip.new{background:#e5eeff;color:var(--pri)}.chip.hidden{background:var(--line)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}.field .inp{width:auto;margin:0;min-width:170px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:center;justify-content:center;padding:14px}.dlg{width:100%;max-width:560px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
@media(max-width:480px){.big-word{font-size:25px}.file{grid-template-columns:22px 94px 1fr 44px}.item{flex-direction:column;align-items:flex-start}.field{flex-direction:column;align-items:flex-start}}
.glist{margin-top:10px;display:flex;flex-direction:column;gap:2px}.grow{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.grow .gt{flex:1}.grow .gb{width:70px}.grow .gs{width:30px;text-align:right;font-size:13px;color:var(--muted)}.grow.known .gs{color:var(--ok);font-weight:800}
.rule p{margin:6px 0;line-height:1.45}.rule{margin:10px 0}
</style>
</head>
